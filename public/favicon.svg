<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  
  <!-- Fundo circular com o gradiente do site -->
  <circle cx="32" cy="32" r="30" fill="url(#gradFavicon)" />
  
  <!-- Detalhe sutil de geometria sagrada/mandala ao fundo -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Monograma GV -->
  <text x="32" y="41" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-1">GV</text>
</svg>